name: check

# No paths-ignore: if `check` is ever made a required status check, a skipped
# run never reports success and docs-only PRs can never be merged. Running it
# on every change is cheap because the Nix caches below do the heavy lifting.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@main

      # A lock that needs updating makes the nightly
      # `nixos-rebuild switch --flake github:salehtl/kakapo#kakapo` fail: it
      # cannot write a lock file for a remote flake. ae89d66 shipped exactly
      # that and broke autoUpgrade silently from 2026-06-01 to 2026-10-03.
      # This step is the cheapest possible guard against a repeat.
      - name: flake.lock is in sync with flake.nix
        run: nix flake lock --no-update-lock-file

      - name: nix flake check
        run: nix flake check --print-build-logs

  # `nix flake check` only evaluates nixosConfigurations — it never builds them,
  # so a package that fails to compile or a bad hash surfaces at 04:00 on the
  # host instead. 6ad5168 dropped the build step believing otherwise. Its own
  # job so the fast checks above still report in a couple of minutes; the
  # NVIDIA driver is unfree and never in cache.nixos.org, so a cold run
  # compiles it here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: kakapo toplevel builds
        run: |
          nix build --print-build-logs --no-link \
            .#nixosConfigurations.kakapo.config.system.build.toplevel
