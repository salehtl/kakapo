name: update-flake-lock

# autoUpgrade only ever builds what flake.lock pins; it never moves the lock.
# Without this, kakapo stays on one nixpkgs commit indefinitely and stops
# receiving nixos-26.05 security backports.
on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 06:00 Asia/Dubai
  workflow_dispatch:

# Every action is pinned to a commit: a moved tag or branch must not change
# what runs here, since anything that reaches master is deployed as root at
# 04:00. The third-party actions run in `lockfile`, whose token is read-only;
# only `pull-request` can write, and it runs no third-party code.
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write # FlakeHub Cache authenticates with OIDC
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@0975873945367f5239ebb5f49c133bf3543a08f6 # v3

      - name: nix flake update
        run: nix flake update

      # The pin `nix flake update` cannot move: the cf CLI in pkgs/cf.
      # Validated by the two steps below like everything else.
      - name: Bump cf to its latest release
        run: nix shell nixpkgs#nodejs nixpkgs#jq nixpkgs#curl -c scripts/update-pins.sh

      # GitHub will not run `check` on the pull request opened below: anything
      # done with the default GITHUB_TOKEN does not trigger further workflows.
      # Rather than store a PAT to work around that, the lock is validated here
      # — in the same run that opens the PR — which needs no credential and
      # proves more than `check` would: that the bumped lock still builds this
      # host. An unvalidated lock is exactly what broke autoUpgrade silently
      # from 2026-06-01 to 2026-10-03.
      #
      # These two steps are therefore the gate. If either fails, the job fails
      # and no PR is opened, so a bad bump never reaches a mergeable state.
      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: kakapo builds on the new lock
        run: |
          nix build --print-build-logs --no-link \
            .#nixosConfigurations.kakapo.config.system.build.toplevel

      - name: Hand the bumped files to the pull-request job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bump
          path: |
            flake.lock
            pkgs/cf/

  pull-request:
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bump

      # git and gh only: no third-party code holds this job's write token.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "nothing to bump"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C flake-lock-bump
          git commit -am "flake: weekly flake.lock bump"
          git push --force origin flake-lock-bump
          if [ "$(gh pr list --head flake-lock-bump --state open --json number --jq length)" = 0 ]; then
            gh pr create --base master --head flake-lock-bump \
              --title "flake: weekly flake.lock bump" --body-file - <<'BODY'
          Automated weekly `nix flake update`, plus cf bumped to its latest
          release by `scripts/update-pins.sh`.

          Validated by the run that opened this PR: `nix flake check` passed
          and `nixosConfigurations.kakapo` built to a `toplevel`. GitHub does
          not run `check` on this PR — PRs opened with `GITHUB_TOKEN` do not
          trigger workflows — so those steps, in the run linked above, are
          the gate.

          Review the nixpkgs diff before merging: merging this to `master` is
          a deploy, applied by `system.autoUpgrade` at 04:00 Asia/Dubai.
          BODY
            gh pr edit flake-lock-bump --add-label dependencies || true
          fi
